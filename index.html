<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn Heart Brand Management</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --bg-matte-black: #0d0e10;
            --velvet-green: #10b981;
            --velvet-green-glow: rgba(16, 185, 129, 0.4);
            --platinum-light: #e5e7eb;
            --platinum-grey: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-matte-black);
            color: var(--platinum-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Swapped SVG styling for PNG styling */
        .leaf-icon {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px var(--velvet-green-glow));
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--platinum-light);
            margin-bottom: 15px;
        }

        .status-text {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--platinum-grey);
            border-top: 1px solid #23272e;
            padding-top: 15px;
            width: 100%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replaced broken CSS shape with your actual PNG asset -->
        <img src="/backdoor/tigress/leaf.png" alt="Unicorn Heart Brand Management Logo" class="leaf-icon">
        
        <h1>Unicorn Heart<br>Brand Management</h1>
        <div class="status-text">Site Under Construction</div>
    </div>

</body>
</html>
